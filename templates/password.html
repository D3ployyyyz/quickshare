<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Arquivo protegido</title>
</head>
<body>
    <h2>🔐 Este arquivo é protegido por senha</h2>

    {% if error %}
        <p style="color:red;">Senha incorreta</p>
    {% endif %}

    <form method="post">
        <input type="password" name="password" placeholder="Senha" required>
        <button type="submit">Continuar</button>
    </form>
</body>
</html>
